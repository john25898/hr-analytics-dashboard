services:
  - type: web
    name: hr-analytics-dashboard
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Free instances get 512 MB RAM. Capping the V8 heap makes the build
      # GC aggressively instead of being OOM-killed.
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      # Shared change store (new workers, edits, transfers, leave, recruitment).
      # `sync: false` means the values are NOT stored in the repo — set them in
      # the Render dashboard (Environment tab). If they are left empty the app
      # still works: lib/server/hr-store.ts falls back to a JSON file on the
      # instance, but that is per-instance and lost on redeploy, so configure
      # these for durable, multi-user persistence.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
